name: parkup_agent
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Internationalization
  intl: ^0.20.2

  # Network
  dio: ^5.7.0

  # Real-time WebSocket
  socket_io_client: ^3.0.2

  # Local Storage
  shared_preferences: ^2.3.3

  # Location
  geolocator: ^13.0.2

  # Map integration
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # URL launching (for navigation)
  url_launcher: ^6.3.1

  # Sharing
  share_plus: ^10.1.4

  # Path provider for file operations
  path_provider: ^2.1.5

  # Bluetooth thermal printing
  flutter_bluetooth_serial: ^0.4.0 # Classic Bluetooth discovery + connection
  esc_pos_utils: ^1.1.0 # ESC/POS command generation
  permission_handler: ^11.3.0 # Runtime permission management
  image: ^3.3.0 # Image processing for Arabic text printing
  connectivity_plus: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.11.0

flutter_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icons/parkup-agent-logo.png"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/parkup-agent-logo.png
    - assets/images/Eu-stars.png
